services:
  trading-bot:
    build: .
    container_name: trading-bot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - bot_data:/app/data

volumes:
  bot_data:
